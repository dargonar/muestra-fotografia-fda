<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muestra de Fotografía · FDA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/cropped-cropped-favicon-32x32.png">
  <meta property="og:title" content="Muestra de Fotografía · FDA">
  <meta property="og:type" content="website">
  <meta property="og:description" content="Muestra de fin de carrera — Proyectos fotográficos">
</head>
<body>

  <!-- ============ TOP BAR ============ -->
  <header id="topbar">
    <div class="logo">
      <a href="#home"><img src="assets/fda.jpg" alt="FDA"></a>
    </div>
    <div class="topbar-actions">
      <a href="#home" class="homeBtn" aria-label="Inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11l9-8 9 8"/>
          <path d="M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/>
        </svg>
      </a>
      <button id="menuBtn" aria-label="Buscar fotógrafos">☰</button>
    </div>
  </header>

  <!-- ============ HOME VIEW ============ -->
  <main id="view-home" class="view active">
    <div class="home-wordmark"><a href="#home">fda foto 2026</a></div>
    <div id="homeGrid" class="home-grid"></div>
  </main>

  <!-- ============ PROJECT VIEW ============ -->
  <main id="view-project" class="view">
    <div id="projectContent"></div>
  </main>

  <!-- ============ PHOTO VIEWER (overlay) ============ -->
  <div id="photoViewer" class="photo-viewer">
    <button class="pv-close" id="pvClose" aria-label="Cerrar">×</button>
    <div class="pv-index" id="pvIndex"></div>
    <div class="pv-image" id="pvImageContainer">
      <img id="pvImg" src="" alt="">
    </div>
    <div class="pv-caption" id="pvCaption"></div>
    <div class="pv-nav">
      <button id="pvPrev" aria-label="Anterior">↑</button>
      <button id="pvNext" aria-label="Siguiente">↓</button>
    </div>
  </div>

  <!-- ============ SEARCH OVERLAY ============ -->
  <div id="searchOverlay" class="search-overlay">
    <div class="search-header">
      <input type="text" id="searchInput" placeholder="Buscar fotógrafo…" autocomplete="off">
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>

  <!-- ============ FOOTER ============ -->
  <footer id="footer">
    <div class="footer-text">Muestra alumnos Foto VI 2026 - Tecnicatura Universitaria en Fotografía - UNLP</div>
    <div class="footer-icons">
      <a href="https://www.instagram.com/fotografia.fda/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4.5"/>
          <circle cx="17.5" cy="6.5" r="0.75" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a href="https://www2.fba.unlp.edu.ar/artesvisuales/fotografia/" target="_blank" rel="noopener" aria-label="Web FDA">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15 15 0 010 20a15 15 0 010-20z"/>
        </svg>
      </a>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
